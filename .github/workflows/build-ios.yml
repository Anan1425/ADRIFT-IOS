name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  RENPY_VERSION: "8.4.1"
  RENPY_SHORT: "8.4"
  APP_NAME: "ADRIFT"
  BUNDLE_ID: "com.adrift.game"
  # Headless display driver for CI (no physical monitor)
  SDL_VIDEODRIVER: "dummy"
  SDL_AUDIODRIVER: "dummy"
  RENPY_NO_DISPLAY: "1"

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Ren'Py SDK
        run: |
          curl -fL -o renpy-sdk.tar.bz2 "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2" || \
          curl -fL -o renpy-sdk.tar.bz2 "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.zip"
          if [ -f renpy-sdk.tar.bz2 ]; then
            tar -xjf renpy-sdk.tar.bz2
          else
            unzip -q renpy-sdk.zip
          fi
          mv "renpy-${RENPY_VERSION}-sdk" renpy-sdk
          echo "Ren'Py SDK ready"
          ls renpy-sdk/

      - name: Download renios (iOS support package)
        run: |
          echo "=== Downloading and extracting renios using RPU extractor ==="
          python3 scripts/extract_rpu.py "${RENPY_VERSION}" renios renpy-sdk/

          echo "=== Verify renios installation ==="
          if [ ! -f "renpy-sdk/renios/hash.txt" ]; then
            echo "ERROR: renios/hash.txt not found"
            ls -la renpy-sdk/renios/ 2>/dev/null || echo "renios directory not found"
            exit 1
          fi
          echo "[OK] renios hash.txt:"
          cat renpy-sdk/renios/hash.txt
          echo ""
          echo "renios contents:"
          ls -la renpy-sdk/renios/

      - name: Setup project
        run: |
          # Create project directory first, then copy game into it
          mkdir -p "renpy-sdk/projects/${APP_NAME}"
          cp -r game "renpy-sdk/projects/${APP_NAME}/"

          echo "=== Repository root ==="
          ls -la
          echo "=== Project directory ==="
          ls -la "renpy-sdk/projects/${APP_NAME}/"
          echo "=== Game directory ==="
          ls -la "renpy-sdk/projects/${APP_NAME}/game/"

          # Verify options.rpy exists (should be from repo)
          if [ ! -f "renpy-sdk/projects/${APP_NAME}/game/options.rpy" ]; then
            echo "WARNING: options.rpy not found, creating minimal version"
            printf 'init python:\n    config.name = "ADRIFT"\n    config.version = "1.0"\n    build.name = "adrift"\n    build.executable_name = "adrift"\n' > "renpy-sdk/projects/${APP_NAME}/game/options.rpy"
          fi

          echo "Project setup complete"

      - name: Pre-compile game scripts (lint check)
        run: |
          cd renpy-sdk
          # Compile scripts with dummy display driver (headless CI)
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy RENPY_NO_DISPLAY=1 \
          ./renpy.sh "projects/${APP_NAME}" compile 2>&1 | tee ../compile.log || true

          echo "=== Compile log (last 30 lines) ==="
          tail -30 ../compile.log || true

          # Verify .rpyc files were created
          echo "=== Compiled scripts ==="
          find "projects/${APP_NAME}/game" -name "*.rpyc" -type f 2>/dev/null | head -20 || true

      - name: Create Xcode project (ios_create)
        run: |
          set -o pipefail
          cd renpy-sdk
          mkdir -p ../xcode-output

          echo "=== Running ios_create ==="
          # Use the ios_create command to generate Xcode project
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy RENPY_NO_DISPLAY=1 \
          ./renpy.sh launcher ios_create \
            "projects/${APP_NAME}" \
            "../xcode-output/${APP_NAME}" 2>&1 | tee ../ios_create.log

          CREATE_EXIT=${PIPESTATUS[0]}
          echo "ios_create exit code: $CREATE_EXIT"

          echo "---"
          echo "=== xcode-output contents ==="
          find ../xcode-output -maxdepth 3 -type d 2>/dev/null || true
          echo "=== Looking for .xcodeproj ==="
          find ../xcode-output -name "*.xcodeproj" -type d 2>/dev/null || true
          find . -name "*.xcodeproj" -type d 2>/dev/null | head -5 || true

          # Verify output was created
          if [ $CREATE_EXIT -ne 0 ]; then
            echo "ERROR: ios_create failed with exit code $CREATE_EXIT"
            echo "=== Full ios_create log ==="
            cat ../ios_create.log || true
            exit 1
          fi

          XCODEPROJ=$(find ../xcode-output -name "*.xcodeproj" -type d | head -1)
          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: ios_create did not produce an .xcodeproj"
            echo "=== Full ios_create log ==="
            cat ../ios_create.log || true
            echo "=== xcode-output tree ==="
            find ../xcode-output 2>/dev/null | head -50 || true
            exit 1
          fi
          echo "[OK] Xcode project created: $XCODEPROJ"

      - name: Update Xcode project with game files (ios_populate)
        run: |
          set -o pipefail
          cd renpy-sdk

          echo "=== Running ios_populate ==="
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy RENPY_NO_DISPLAY=1 \
          ./renpy.sh launcher ios_populate \
            "projects/${APP_NAME}" \
            "../xcode-output/${APP_NAME}" 2>&1 | tee ../ios_populate.log

          POPULATE_EXIT=${PIPESTATUS[0]}
          echo "ios_populate exit code: $POPULATE_EXIT"

          echo "---"
          echo "After populate:"
          find "../xcode-output/${APP_NAME}" -name "*.xcodeproj" -type d 2>/dev/null
          ls "../xcode-output/${APP_NAME}/base/" 2>/dev/null | head -20

          if [ $POPULATE_EXIT -ne 0 ]; then
            echo "ERROR: ios_populate failed with exit code $POPULATE_EXIT"
            echo "=== Full ios_populate log ==="
            cat ../ios_populate.log || true
            exit 1
          fi
          echo "[OK] ios_populate completed"

      - name: Locate Xcode project
        id: locate_xcode
        run: |
          # Search broadly for the xcodeproj
          XCODEPROJ=""
          for search_dir in "xcode-output" "." "renpy-sdk" "renpy-sdk/xcode-output"; do
            XCODEPROJ=$(find "$search_dir" -name "*.xcodeproj" -type d 2>/dev/null | head -1)
            if [ -n "$XCODEPROJ" ]; then
              break
            fi
          done

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: Could not find Xcode project anywhere"
            echo "=== Searching entire workspace ==="
            find . -name "*.xcodeproj" -type d 2>/dev/null || true
            echo "=== xcode-output tree ==="
            find xcode-output 2>/dev/null | head -50 || true
            exit 1
          fi

          echo "xcodeproj=$XCODEPROJ" >> $GITHUB_OUTPUT
          echo "Found: $XCODEPROJ"
          PROJECT_DIR="$(cd "$(dirname "$XCODEPROJ")" && pwd)"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Project dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configure Info.plist
        run: |
          PROJECT_DIR="${{ steps.locate_xcode.outputs.project_dir }}"
          INFO_PLIST=$(find "$PROJECT_DIR" -name "Info.plist" -not -path "*/build/*" | head -1)

          if [ -z "$INFO_PLIST" ] || [ ! -f "$INFO_PLIST" ]; then
            echo "ERROR: Info.plist not found"
            find "$PROJECT_DIR" -name "Info.plist" 2>/dev/null
            exit 1
          fi

          echo "Configuring: $INFO_PLIST"

          # Landscape only
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$INFO_PLIST"

          # Keep screen on
          /usr/libexec/PlistBuddy -c "Delete :UIIdleTimerDisabled" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIIdleTimerDisabled bool true" "$INFO_PLIST"

          # Full screen only
          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$INFO_PLIST"

          # Hide status bar
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarHidden" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$INFO_PLIST"

          # Bundle ID
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string ${BUNDLE_ID}" "$INFO_PLIST"

          echo "Info.plist configured:"
          cat "$INFO_PLIST"

      - name: Generate app icon
        run: |
          PROJECT_DIR="${{ steps.locate_xcode.outputs.project_dir }}"
          ASSETS_DIR=$(find "$PROJECT_DIR" -name "*.xcassets" -type d -not -path "*/build/*" | head -1)

          if [ -z "$ASSETS_DIR" ]; then
            ASSETS_DIR="$PROJECT_DIR/$APP_NAME/Media.xcassets"
            mkdir -p "$ASSETS_DIR"
          fi

          APPICON_DIR="$ASSETS_DIR/AppIcon.appiconset"
          mkdir -p "$APPICON_DIR"

          # Generate icon using Python
          python3 << 'PYEOF'
          import struct, zlib, os

          def create_png(width, height, color, text=None):
              """Create a simple PNG file."""
              # Simple solid color PNG
              raw = b''
              for y in range(height):
                  raw += b'\x00'  # filter byte
                  for x in range(width):
                      raw += bytes(color)

              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)

              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
              idat = zlib.compress(raw)
              return sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')

          icon = create_png(1024, 1024, (26, 26, 46))
          outdir = os.environ.get('APPICON_DIR', '.')
          with open(os.path.join(outdir, 'icon-1024.png'), 'wb') as f:
              f.write(icon)
          print("Icon generated")
          PYEOF

          # Create Contents.json
          cat > "$APPICON_DIR/Contents.json" << 'EOF'
          {
            "images" : [
              { "idiom" : "universal", "platform" : "ios", "size" : "1024x1024", "filename" : "icon-1024.png" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF

          echo "App icon ready at: $APPICON_DIR"
          ls -la "$APPICON_DIR"

      - name: Build iOS app
        run: |
          PROJECT_DIR="${{ steps.locate_xcode.outputs.project_dir }}"
          XCODEPROJ="${{ steps.locate_xcode.outputs.xcodeproj }}"
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          cd "$PROJECT_DIR"

          echo "Building scheme: $SCHEME"
          echo "Project dir: $(pwd)"
          ls -la

          # Build without code signing
          xcodebuild \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -80

          # Find built app
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in build output"
            find build -name "*.app" 2>/dev/null || true
            ls -la build/ 2>/dev/null || true
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Built: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Package IPA
        run: |
          PROJECT_DIR="${{ steps.locate_xcode.outputs.project_dir }}"
          APP_PATH=$(find "$PROJECT_DIR/build" -name "*.app" -type d | head -1)

          cd "$PROJECT_DIR"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "${APP_NAME}.ipa" Payload/
          rm -rf Payload

          IPA_PATH="$(pwd)/${APP_NAME}.ipa"
          echo "IPA created: $IPA_PATH"
          ls -lh "$IPA_PATH"

          # Copy to workspace root for easy access
          cp "$IPA_PATH" "${GITHUB_WORKSPACE}/${APP_NAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APP_NAME }}-iOS-IPA"
          path: "${{ env.APP_NAME }}.ipa"
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            *.log
            **/build/Logs/**
            xcode-output/**/*.log
          retention-days: 7
